# sitemap.xml and robots.txt hold nothing but absolute self-references built
# from `site-url`. Fetching those over the network would test whatever is
# currently deployed at hpc.kolen.dev rather than the output just built here —
# and before the very first deployment it cannot pass at all, since Cloudflare
# answers for an attached custom domain with no deployment behind it by
# returning 522. Every internal link is already checked as a local file.
exclude_path = [
    "src/docs/sitemap.xml",
    "src/docs/robots.txt",
]

# Links lychee cannot verify anonymously. Both are private GitHub repos, which
# return 404 to unauthenticated requests. Drop an entry once its repo is public
# (or run lychee with --github-token to check them for real).
exclude = [
    "^https://github\\.com/ickc/hpc\\.kolen\\.dev/?$",
    "^https://github\\.com/ickc/isambard-workspace",
]
