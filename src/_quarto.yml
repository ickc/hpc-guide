project:
  type: website
  output-dir: docs
  render:
    - "**/*.md"
  resources:
    # Tell GitHub Pages not to run the output through Jekyll
    - .nojekyll

website:
  title: "HPC Guide"
  description: "A guide to be effective on utilizing HPC resources"
  search:
    location: sidebar
    type: textbox
  navbar:
    left:
      - href: index.md
        text: Home
    right:
      - icon: github
        href: https://github.com/ickc/hpc-guide
        aria-label: GitHub
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - href: index.md
        text: Overview
      - section: "Package managers"
        href: package-managers/index.md
        contents:
          - package-managers/conda.md
          - package-managers/conda-mpi.md
          - package-managers/spack.md
          - package-managers/spack-mpi.md
      - href: mpi/index.md
        text: MPI
      - section: "Running jobs"
        contents:
          - running-jobs/workflow.md
          - running-jobs/embarassingly-parallel.md
          - running-jobs/oversubscription.md
      - section: "Storage"
        contents:
          - lustre.md
      - href: text-editors/index.md
        text: Text editors
  page-footer:
    left: "© Kolen Cheung"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    email-obfuscation: javascript

execute:
  freeze: auto
