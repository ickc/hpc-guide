# This site's own settings, merged on top of the shared `_quarto.yml` from
# https://github.com/ickc/quarto-template (see there for how the two combine).
project:
  output-dir: docs
  render:
    - "**/*.md"

website:
  title: "HPC Guide"
  site-url: "https://hpc.kolen.dev"
  description: "A guide to be effective on utilizing HPC resources"
  search:
    location: sidebar
    type: textbox
  navbar:
    left:
      - href: index.md
        text: Home
    right:
      - icon: github
        href: https://github.com/ickc/hpc.kolen.dev
        aria-label: GitHub
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - href: index.md
        text: Overview
      - section: "Package managers"
        href: package-managers/index.md
        contents:
          - auto: "package-managers/*.md"
      - section: "MPI"
        href: mpi/index.md
        contents:
          - auto: "mpi/*.md"
      - section: "Running jobs"
        href: running-jobs/index.md
        contents:
          - auto: "running-jobs/*.md"
      - section: "Storage"
        href: storage/index.md
        contents:
          - auto: "storage/*.md"
      - section: "Text editors"
        href: text-editors/index.md
        contents:
          - auto: "text-editors/*.md"
  page-footer:
    left: "© {{< copyright-year 2026 >}} Kolen Cheung"
