# This site's own settings, merged on top of the shared `_quarto.yml` from
# https://github.com/ickc/quarto-template (see there for how the two combine).
project:
  output-dir: docs
  render:
    - "**/*.md"
  # Example scripts are published as they are, so pages can link to them as downloads.
  resources:
    - "examples/**"
  # The post graph (the template's README, "The post graph"): graph.json and its viewer.
  post-render:
    - paragraphic build --preset quarto --groups directories --exclude 404.html

website:
  title: "HPC Guide"
  site-url: "https://hpc.kolen.dev"
  description: "A practical guide, by example, to getting your analysis done on an HPC cluster"
  search:
    location: sidebar
    type: textbox
  announcement:
    content: "This guide is in alpha: pages are still being written, and may change or move."
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
  navbar:
    left:
      - href: index.md
        text: Home
      - href: graph.md
        text: Graph
    right:
      - icon: github
        href: https://github.com/ickc/hpc-guide
        aria-label: GitHub
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - href: index.md
        text: Overview
      - section: "Getting started"
        href: getting-started/index.md
        contents:
          - auto: "getting-started/*.md"
      # A part with subsections lists its pages and subsections in order,
      # since an auto glob cannot place a folder between two pages.
      - section: "Software environments"
        href: software/index.md
        contents:
          - software/10-intro.md
          - section: "Package managers"
            href: software/package-managers/index.md
            contents:
              - auto: "software/package-managers/*.md"
          - software/30-tools.md
          - section: "MPI"
            href: software/mpi/index.md
            contents:
              - auto: "software/mpi/*.md"
          - software/50-shipping.md
      - section: "Parallelism"
        href: parallel/index.md
        contents:
          - parallel/10-intro.md
          - parallel/20-threads.md
          - section: "Many independent tasks"
            href: parallel/tasks/index.md
            contents:
              - auto: "parallel/tasks/*.md"
          - parallel/30-hybrid-mpi.md
          - parallel/40-workflows.md
      - section: "Storage"
        href: storage/index.md
        contents:
          - auto: "storage/*.md"
      - section: "Working interactively"
        href: interactive/index.md
        contents:
          - interactive/10-editors.md
          - interactive/20-shell.md
          - section: "Services on a compute node"
            href: interactive/services/index.md
            contents:
              - auto: "interactive/services/*.md"
  page-footer:
    left: "© {{< copyright-year 2026 >}} Kolen Cheung. Text under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/), code under [BSD-3-Clause](https://github.com/ickc/hpc-guide/blob/main/LICENSE)."

# Embeds a file verbatim as a code block: ```{.bash include="../examples/hello/job.sh"}.
# panclude (https://github.com/ickc/panclude), vendored at commit 281c3e3.
# Here, not in the shared _quarto.yml, which is not this site's to edit.
filters:
  - filters/panclude.lua

format:
  html:
    # The page's own graph card (the post graph).
    include-after-body:
      - _paragraphic.html
