spack:
  specs:
  - osu-micro-benchmarks
  view: true
  concretizer:
    unify: true
  packages:
    all:
      providers:
        mpi: [cray-mpich]
    cray-mpich:
      buildable: false
      externals:
      - spec: cray-mpich@8.1.30
        prefix: /path/to/cray-mpich # $MPICH_DIR, with the module loaded
    cray-pmi:
      buildable: false
      externals:
      - spec: cray-pmi@6.1.15
        prefix: /path/to/cray-pmi # pkg-config --variable=prefix cray-pmi
    libfabric:
      buildable: false
      externals:
      - spec: libfabric@1.22.0 fabrics=cxi
        prefix: /path/to/libfabric # pkg-config --variable=prefix libfabric
