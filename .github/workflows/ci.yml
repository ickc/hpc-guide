name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true
      # Fails when a file is not in the canonical form `pixi run format` produces,
      # including a missing or stale output-file permalink.
      - run: pixi run format-check

  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true
      - run: pixi run build
      - run: pixi run linkcheck-except-429
