name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the deploy job widens nothing, it only restates this.
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags: a tag can be moved to point at
# new code, and `wrangler-action` runs in the same job as the Cloudflare API token.
# The trailing comment is the human-readable version; Dependabot updates both.

jobs:
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          locked: true
      # Fails when a file is not in the canonical form `pixi run format` produces,
      # including a missing or stale output-file permalink.
      - run: pixi run format-check

  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          locked: true
      - run: pixi run build
      - run: pixi run linkcheck-except-429
      # Handed to the deploy job so the site is built exactly once.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: src/docs
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    # Only main, and only once the formatting and link checks have passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, build]
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are environment secrets,
    # not repository secrets, so the job has to name the environment to see them.
    environment:
      name: production
      url: https://hpc.kolen.dev
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: src/docs
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch is what makes this a *production* deployment, i.e. the one
          # hpc.kolen.dev serves. Wrangler normally infers it from the checked-out
          # repository, but this job only downloads the built artifact and so has
          # no .git to infer from; left off, the upload lands as a preview.
          command: >-
            pages deploy src/docs
            --project-name=hpc-kolen-dev
            --branch=main
            --commit-dirty=true
