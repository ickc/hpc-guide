[workspace]
authors = ["Kolen Cheung <christian.kolen@gmail.com>"]
name = "hpc-guide"
version = "0.1.0"
description = "A guide to be effective on utilizing HPC resources"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
quarto = "*"
lychee = "*"
pandoc = "*"
python = ">=3.11"

[activation]
env = { QUARTO_PORT = "8018" }

[tasks]
build = { cmd = "quarto render", cwd = "src", description = "Render the Quarto site" }
serve = { cmd = "quarto preview src --port $QUARTO_PORT --host 0.0.0.0", description = "Preview the Quarto site on port QUARTO_PORT" }
clean = { cmd = "rm -rf docs .quarto", cwd = "src", description = "Remove generated files (Quarto output and cache)" }

format = { cmd = "python bin/md_formatter.py src --derive-output-file", description = "Normalise markdown through pandoc and derive output-file from filenames" }
format-check = { cmd = "python bin/md_formatter.py src --derive-output-file --check", description = "Fail if any markdown file is not formatted" }
# --root-dir resolves the root-relative links Quarto writes into 404.html. It has
# to be an absolute path, so it cannot live in lychee.toml alongside the rest of
# the configuration; $PIXI_PROJECT_ROOT supplies one wherever the task is run from.
linkcheck = { cmd = "lychee --no-ignore --exclude-loopback --max-redirects 10 --root-dir $PIXI_PROJECT_ROOT/src/docs -v src/docs", depends-on = ["build"], description = "Check links in the rendered site via lychee" }
linkcheck-except-429 = { cmd = "lychee --no-ignore --accept '100..=299, 429' --exclude-loopback --max-redirects 10 --root-dir $PIXI_PROJECT_ROOT/src/docs -v src/docs", depends-on = ["build"], description = "Check links via lychee, accepting 429 (too many requests). Primarily for CI." }
